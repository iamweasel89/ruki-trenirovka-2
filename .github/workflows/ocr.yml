name: trenirovka-ocr
on:
  push:
    branches: [trener-ocr]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ocr
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: public hygiene check
        shell: powershell
        run: ./ci/proverka-gigieny.ps1
      - name: parse all scripts
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $e = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { $bad++; $e | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($bad) { exit 1 }
      - name: prepare runner (screen, OCR languages, Tesseract)
        shell: powershell
        run: ./ci/ocr/podgotovka.ps1 -Vyhod podgotovka.json; Get-Content podgotovka.json
      - name: smoke runs
        timeout-minutes: 12
        shell: powershell
        run: |
          ./ci/ocr/progon-ocr.ps1 -Seed 0 -Tolko 'holst-ru,holst-en,net-en' -Masshtaby '1' -LimitSek 420 -Vyhod rezultat-smoke.json
          if (-not (Test-Path rezultat-smoke.json)) { Write-Host 'harness gave no result'; exit 1 }
          $j = Get-Content -Raw rezultat-smoke.json | ConvertFrom-Json
          if (@($j.progony).Count -eq 0) { Write-Host 'no run finished'; exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rezultat-smoke
          path: rezultat-smoke.json
          if-no-files-found: warn

  matrica:
    needs: smoke
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - name: prepare runner
        shell: powershell
        run: ./ci/ocr/podgotovka.ps1 -Vyhod podgotovka.json
      - name: runs of the skill on recognition plans
        timeout-minutes: 38
        shell: powershell
        run: |
          ./ci/ocr/progon-ocr.ps1 -Seed ${{ matrix.seed }} -LimitSek 2100 -Vyhod "rezultat-${{ matrix.seed }}.json"
          if (-not (Test-Path "rezultat-${{ matrix.seed }}.json")) { Write-Host 'harness gave no result'; exit 1 }
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rezultat-${{ matrix.seed }}
          path: rezultat-${{ matrix.seed }}.json
          if-no-files-found: warn

  svod:
    needs: [smoke, matrica]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rezultat-*
          path: rez
          merge-multiple: true
      - name: runner minutes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" > jobs.json || echo '{}' > jobs.json
      - name: aggregate
        run: |
          mkdir -p rez-matrica out-smoke
          find rez -name 'rezultat-[0-9]*.json' -exec cp {} rez-matrica/ \;
          find rez -name 'rezultat-smoke.json' -exec cp {} out-smoke/ \;
          if ls rez-matrica/*.json >/dev/null 2>&1; then python3 ci/ocr/svod-ocr.py rez-matrica out jobs.json || true; else python3 ci/ocr/svod-ocr.py out-smoke out jobs.json || true; fi
          ls out/itog.md >/dev/null 2>&1 || { mkdir -p out; echo '{}' > out/itog.json; echo 'net dannyh' > out/itog.md; }
      - name: publish to branch itog-ocr
        run: |
          git config user.name ci; git config user.email ci@users.noreply.github.com
          cp -r rez /tmp/rez-all
          git checkout --orphan itog-tmp && git rm -rf . -q
          cp out/itog.json out/itog.md . && mkdir -p syroe && cp /tmp/rez-all/*.json syroe/ 2>/dev/null || true
          git add itog.json itog.md syroe
          git commit -qm "itog-ocr run $GITHUB_RUN_ID sha $GITHUB_SHA"
          git push -f origin HEAD:itog-ocr
