<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Полигон — Ввод: числа</title>
<link rel="stylesheet" href="../stil.css">
<style>.podskazki{list-style:none;margin:0;padding:0;border:1px solid #999;background:#fff;max-width:420px}
.podskazki li{padding:4px 8px;cursor:pointer}.podskazki li[aria-selected=true]{background:#cde}</style></head>
<body>
<header><b>Полигон</b><input id="poisk" type="text" aria-label="Поиск по сайту" placeholder="Поиск"></header>
<main>
<h1>Числа в разных локалях</h1>
<form id="forma" hidden>
  <label>Сумма (ru) <input id="summa_ru" type="text" inputmode="decimal" data-lokal="ru" aria-label="Сумма ru"></label>
  <label>Amount (en) <input id="summa_en" type="text" inputmode="decimal" data-lokal="en" aria-label="Amount en"></label>
  <label>Betrag (de) <input id="summa_de" type="text" inputmode="decimal" data-lokal="de" aria-label="Betrag de"></label>
  <label>Количество <input id="kolichestvo" type="number" step="0.01" aria-label="Количество"></label>
  <button type="button" id="sohranit" disabled>Сохранить суммы</button>
</form>
<label>Контроль <textarea id="kontrol" readonly aria-label="Контроль" rows="2"></textarea></label>
</main>
<script src="../pomehi.js"></script>
<script src="vvod.js"></script>
<script>
(function () {
  var forma = document.getElementById('forma');
  function z(id) { var e = document.getElementById(id); return e && e.value.length > 0; }
  V.knopka(forma, 'sohranit', function () { return z('summa_ru') && z('summa_en') && z('summa_de') && z('kolichestvo'); });
  P.pokazatPozzhe(forma, 200, 1800);
})();
</script>
</body></html>
