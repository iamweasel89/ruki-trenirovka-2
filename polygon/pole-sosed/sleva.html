<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Poligon - Pole sosed: metka sleva</title>
<link rel="stylesheet" href="sosed.css">
<style>
.stroka { display: flex; align-items: center; gap: 14px; margin: 12px 0; }
.stroka > span { width: 130px; flex: none; }
.stroka input { flex: 1; }
/* labels in one column, fields in another: tree order does not pair them, only geometry does */
.kolonki { display: flex; gap: 14px; margin-top: 22px; }
.kolonki .lev { width: 130px; flex: none; }
.kolonki .lev div { height: 34px; line-height: 34px; margin-bottom: 10px; }
.kolonki .prav { flex: 1; }
.kolonki .prav input { display: block; width: 100%; height: 34px; margin-bottom: 10px; }
</style></head>
<body>
<header><b>Poligon</b> label to the left</header>
<main>
<h1>Delivery address</h1>
<div id="forma" hidden>
<div class="blok">
  <div class="stroka"><span>City</span><input type="text" data-pole="gorod"></div>
  <div class="stroka"><span>Street</span><input type="text" data-pole="ulica"></div>
  <div class="stroka"><span>House</span><input type="text" data-pole="dom"><span>Flat</span><input type="text" data-pole="kvartira"></div>
  <div class="kolonki">
    <div class="lev"><div>Phone</div><div>Fax</div><div>Courier note</div></div>
    <div class="prav"><input type="tel" data-pole="telefon"><input type="tel" data-pole="faks"><input type="text" data-pole="zametka"></div>
  </div>
</div>
</div>
<div class="kontrol-blok"><textarea id="kontrol" readonly aria-label="Kontrol"></textarea></div>
</main>
<script src="sosed.js"></script>
<script>S.pokazat();</script>
</body></html>
