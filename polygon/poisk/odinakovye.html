<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Полигон П — Одинаковые</title>
<link rel="stylesheet" href="../stil.css"><link rel="stylesheet" href="poisk.css"></head>
<body>
<header><b>Полигон</b><input id="poisk" type="text" aria-label="Поиск по сайту" placeholder="Поиск"></header>
<main>
<h1>Три карточки с одинаковыми кнопками</h1>
<section class="kartochka" aria-label="Счёт"><h2>Счёт</h2><button type="button" data-k="schet-sohr">Сохранить</button> <button type="button" data-k="schet-otm">Отмена</button></section>
<section class="kartochka" aria-label="Доставка"><h2>Доставка</h2><button type="button" data-k="dost-sohr">Сохранить</button> <button type="button" data-k="dost-otm">Отмена</button></section>
<section class="kartochka" aria-label="Профиль"><h2>Профиль</h2><button type="button" data-k="prof-sohr">Сохранить</button> <button type="button" data-k="prof-otm">Отмена</button>
  <button type="button" data-k="prof-skryt" style="display:none">Удалить профиль</button></section>
<section class="kartochka" aria-label="Подвал"><h2>Подвал</h2><a href="#" data-k="podval-ssylka">Сохранить</a> <button type="button" data-k="podval-sohr-vse">Сохранить всё</button></section>
</main>
<script src="obshchee.js"></script>
</body></html>
